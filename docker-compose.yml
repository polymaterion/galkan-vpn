services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: infra/Dockerfile.billing
    command: alembic upgrade head
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  seed:
    build:
      context: .
      dockerfile: infra/Dockerfile.billing
    command: python seeds/seed.py
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    depends_on:
      migrate:
        condition: service_completed_successfully

  billing:
    build:
      context: .
      dockerfile: infra/Dockerfile.billing
    restart: unless-stopped
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      REDIS_URL: redis://${REDIS_HOST}:${REDIS_PORT}/${REDIS_DB}
    networks:
      - default
      - amnezia_api_net
    # Exposes ONLY the public /connect/{token} landing page to the internet
    # (the "Open in Amnezia" button target). Every other route on this port
    # still requires the X-Billing-Key header — see api/dependencies.py and
    # api/routers/connect.py for what is and isn't protected.
    ports:
      - "${PUBLIC_PORT:-8080}:8000"
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.billing
    restart: unless-stopped
    command: python -m billing.workers.scheduler
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      REDIS_URL: redis://${REDIS_HOST}:${REDIS_PORT}/${REDIS_DB}
    networks:
      - default
      - amnezia_api_net
    depends_on:
      billing:
        condition: service_healthy

  bot:
    build:
      context: .
      dockerfile: infra/Dockerfile.bot
    restart: unless-stopped
    command: python -m bot.main
    env_file: .env
    environment:
      BILLING_BASE_URL: http://billing:8000
    depends_on:
      billing:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    # Default network for this project's own services (db, redis, bot, etc).
  amnezia_api_net:
    # The amnezia-api project's own compose network. Joining it lets billing
    # and worker reach amnezia-api by container name (http://amnezia-api:4001)
    # without opening its port to the outside world or relying on the host's
    # external IP, which amnezia-api's docker-proxy doesn't accept connections
    # on anyway (it's bound to 127.0.0.1 on the host, not 0.0.0.0).
    external: true
    name: amnezia-api_default
